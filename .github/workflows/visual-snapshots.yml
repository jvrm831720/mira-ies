name: MIRA visual regression screenshots

on:
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/visual-snapshots.yml"

jobs:
  visual-snapshots:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install headless browser
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Capture screenshots (isolated read-only fixtures)
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:3000
        run: |
          npm run dev > /tmp/mira-visual-next.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:3000/login > /dev/null; then break; fi
            sleep 2
          done
          python e2e/capture_visuals.py
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mira-visual-screenshots
          path: frontend/e2e/artifacts/*.png
          if-no-files-found: warn
