name: Prepare and validate Cloudflare deployment

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/prepare-cloudflare.yml'

permissions:
  contents: write

concurrency:
  group: cloudflare-preparation-main
  cancel-in-progress: false

jobs:
  prepare-and-validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerate package-lock.json
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit updated lockfile to main
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json is already synchronized."
          else
            git commit -m "chore: sync Cloudflare deployment dependencies"
            git push origin HEAD:main
          fi

      - name: Install exact dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Build and validate OpenNext output
        env:
          NEXT_PUBLIC_API_URL: https://api.example.invalid
        run: npx opennextjs-cloudflare build
