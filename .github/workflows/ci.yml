name: CI

on:
  push:
    branches: [main, feat/mira-control-center, feat/model-data-governance-phase-1, feat/institutional-training-authorization, feat/backend-training-policy-guards, 'feat/ai-retention-campaigns-*', 'feat/wave6-academic-operations-*']
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: beacon
          POSTGRES_PASSWORD: beacon_secret
          POSTGRES_DB: beacon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U beacon -d beacon_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://beacon:beacon_secret@localhost:5432/beacon_test
      DATABASE_URL_SYNC: postgresql://beacon:beacon_secret@localhost:5432/beacon_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Create non-superuser PostgreSQL test role
        env:
          ADMIN_DATABASE_URL: postgresql://beacon:beacon_secret@localhost:5432/postgres
          TEST_DATABASE_URL: postgresql://beacon:beacon_secret@localhost:5432/beacon_test
        run: |
          psql "$ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $mira$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'mira_test_runner') THEN
              CREATE ROLE mira_test_runner LOGIN PASSWORD 'mira_test_runner_secret'
                NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS;
            ELSE
              ALTER ROLE mira_test_runner LOGIN PASSWORD 'mira_test_runner_secret'
                NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS;
            END IF;
          END
          $mira$;
          ALTER DATABASE beacon_test OWNER TO mira_test_runner;
          SQL
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          ALTER SCHEMA public OWNER TO mira_test_runner;
          GRANT ALL ON SCHEMA public TO mira_test_runner;
          SQL
          echo "DATABASE_URL=postgresql+asyncpg://mira_test_runner:mira_test_runner_secret@localhost:5432/beacon_test" >> "$GITHUB_ENV"
          echo "DATABASE_URL_SYNC=postgresql://mira_test_runner:mira_test_runner_secret@localhost:5432/beacon_test" >> "$GITHUB_ENV"
          echo "MIRA_TEST_PSQL_URL=postgresql://mira_test_runner:mira_test_runner_secret@localhost:5432/beacon_test" >> "$GITHUB_ENV"
          echo "MIRA_TEST_PRESERVE_MIGRATED_SCHEMA=true" >> "$GITHUB_ENV"
          echo "MIRA_REQUIRE_NON_SUPERUSER_DB_ROLE=mira_test_runner" >> "$GITHUB_ENV"
      - name: Validate Alembic revision graph
        working-directory: backend
        run: |
          heads="$(PYTHONPATH=. alembic heads)"
          echo "$heads"
          test "$(printf '%s\n' "$heads" | grep -c '(head)')" -eq 1
          head_revision="$(printf '%s\n' "$heads" | awk 'NR == 1 { print $1 }')"
          test "${#head_revision}" -le 32
      - name: Apply Alembic migrations on disposable CI database
        working-directory: backend
        run: |
          PYTHONPATH=. alembic upgrade 006_safe_agent_delivery
          PYTHONPATH=. alembic stamp 038_high_risk_confirmation
          psql "$MIRA_TEST_PSQL_URL" -v ON_ERROR_STOP=1 <<'SQL'
          -- Legacy 002/004 bootstrap create_all uses the current ORM metadata.
          -- Remove later-wave tables/columns before replaying revisions 039..head.
          DROP TABLE IF EXISTS
            mira_object_view_favorites, mira_object_view_revisions,
            mira_object_views,
            mira_asaas_destination_reviews, mira_asaas_webhook_applications, mira_asaas_webhook_events,
            mira_asaas_charges, mira_asaas_customer_bindings,
            mira_academic_operation_events,
            mira_academic_class_outcomes,
            mira_academic_enrollment_request_classes,
            mira_academic_enrollment_requests,
            mira_academic_student_programs,
            mira_academic_curriculum_items,
            mira_academic_curricula,
            mira_academic_policies,
            mira_student_service_notifications, mira_student_service_attachments,
            mira_student_service_comments, mira_student_document_templates,
            mira_student_payment_evidence, mira_student_payment_intents,
            mira_payment_provider_profiles, mira_asaas_workspace_destinations,
            mira_finance_review_events, mira_finance_review_cases,
            mira_finance_observations, mira_finance_ingestion_batches,
            mira_finance_student_links, mira_finance_source_profiles,
            mira_student_document_attestations,
            mira_student_financial_sync_runs,
            mira_student_financial_references, mira_student_documents,
            mira_student_service_events, mira_student_service_requests,
            mira_academic_catalog_audit, mira_academic_calendar_events,
            mira_academic_grades, mira_academic_assessments,
            mira_academic_attendance, mira_academic_lessons,
            mira_academic_class_enrollments, mira_academic_classes,
            mira_academic_terms, mira_academic_teachers, mira_academic_subjects,
            mira_academic_programs, mira_student_portal_sessions,
            mira_student_portal_invites, mira_academic_records,
            custom_field_definitions,
            tenant_composio_tool_approvals, tenant_omie_connections,
            mira_module_entitlements, mira_tenant_domains, mira_tenant_branding,
            mira_tenant_logo_assets,
            mira_memberships, mira_organizations,
            mira_tenant_role_audit, mira_tenant_roles,
            student_feature_observations, tenant_integration_data_sources,
            tenant_composio_oauth_states,
            tenant_composio_toolkit_policies, tenant_composio_tool_audit,
            tenant_composio_accounts, tenant_composio_sessions,
            tenant_connector_destination_audit, tenant_connector_destinations,
            eligible_contributions, training_dataset_snapshots, training_runs,
            mira_base_lifecycle_events CASCADE;
          -- The legacy ORM bootstrap created Wave 5 columns in old base tables.
          -- Drop them before 071 so migrations can prove their additive DDL.
          ALTER TABLE work_activity_events DROP COLUMN IF EXISTS operation_key CASCADE;
          ALTER TABLE work_activities DROP COLUMN IF EXISTS revision CASCADE;
          ALTER TABLE students DROP COLUMN IF EXISTS custom_fields CASCADE;
          ALTER TABLE tenants DROP COLUMN IF EXISTS organization_id CASCADE;
          ALTER TABLE mira_users DROP COLUMN IF EXISTS custom_role_id CASCADE;
          ALTER TABLE mira_org_invites DROP COLUMN IF EXISTS custom_role_id CASCADE;
          SQL
          PYTHONPATH=. alembic upgrade head
      - name: Verify migrated security controls
        run: |
          psql "$MIRA_TEST_PSQL_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $mira$
          BEGIN
            IF EXISTS (
              SELECT 1 FROM pg_roles
              WHERE rolname = current_user AND (rolsuper OR rolbypassrls)
            ) THEN
              RAISE EXCEPTION 'CI migration runner must not be superuser or BYPASSRLS';
            END IF;
            IF NOT EXISTS (
              SELECT 1 FROM pg_policies
              WHERE schemaname = 'public'
                AND tablename = 'mira_organizations'
                AND policyname = 'mira_organizations_tenant_isolation'
            ) THEN
              RAISE EXCEPTION 'Expected tenant RLS policy is missing on migrated schema';
            END IF;
            IF EXISTS (
              SELECT 1 FROM (VALUES
                ('mira_student_service_requests'),
                ('mira_student_service_events'),
                ('mira_student_documents'),
                ('mira_student_financial_references')
              ) AS required(table_name)
              LEFT JOIN pg_class cls ON cls.relname = required.table_name
              LEFT JOIN pg_namespace ns ON ns.oid = cls.relnamespace AND ns.nspname = 'public'
              WHERE cls.oid IS NULL OR ns.oid IS NULL
                OR NOT cls.relrowsecurity OR NOT cls.relforcerowsecurity
                OR NOT EXISTS (
                  SELECT 1 FROM pg_policies pol
                  WHERE pol.schemaname = 'public' AND pol.tablename = required.table_name
                    AND pol.policyname = required.table_name || '_tenant_access'
                )
            ) THEN
              RAISE EXCEPTION 'Wave 3 RLS/FORCE RLS controls missing';
            END IF;
            IF NOT EXISTS (
              SELECT 1 FROM pg_class cls JOIN pg_namespace ns ON ns.oid=cls.relnamespace
              WHERE ns.nspname='public' AND cls.relname='mira_student_document_attestations'
                AND cls.relrowsecurity AND cls.relforcerowsecurity
            ) THEN
              RAISE EXCEPTION 'Wave 4 document attestation RLS missing';
            END IF;
            IF NOT EXISTS (
              SELECT 1 FROM pg_class cls JOIN pg_namespace ns ON ns.oid=cls.relnamespace
              WHERE ns.nspname='public' AND cls.relname='mira_student_financial_sync_runs'
                AND cls.relrowsecurity AND cls.relforcerowsecurity
            ) THEN
              RAISE EXCEPTION 'Wave 4 financial sync RLS missing';
            END IF;
            IF NOT EXISTS (
              SELECT 1 FROM pg_trigger
              WHERE tgname = 'mira_student_service_event_immutable'
                AND NOT tgisinternal
            ) THEN
              RAISE EXCEPTION 'Student request audit immutable trigger is missing';
            END IF;
            IF EXISTS (
              SELECT 1 FROM (VALUES
                ('mira_finance_source_profiles'),
                ('mira_finance_student_links'),
                ('mira_finance_ingestion_batches'),
                ('mira_finance_observations'),
                ('mira_finance_review_cases'),
                ('mira_finance_review_events')
              ) AS required(table_name)
              LEFT JOIN pg_class cls ON cls.relname = required.table_name
              LEFT JOIN pg_namespace ns ON ns.oid = cls.relnamespace AND ns.nspname = 'public'
              WHERE cls.oid IS NULL OR ns.oid IS NULL
                OR NOT cls.relrowsecurity OR NOT cls.relforcerowsecurity
                OR NOT EXISTS (
                  SELECT 1 FROM pg_policies pol
                  WHERE pol.schemaname = 'public' AND pol.tablename = required.table_name
                    AND pol.policyname = required.table_name || '_tenant_access'
                )
            ) THEN
              RAISE EXCEPTION 'Wave 4C tenant RLS/FORCE RLS policy missing';
            END IF;
            IF (
              SELECT count(*) FROM pg_trigger
              WHERE tgname IN (
                'mira_finance_ingestion_batches_immutable',
                'mira_finance_observations_immutable',
                'mira_finance_review_events_immutable'
              ) AND NOT tgisinternal
            ) <> 3 THEN
              RAISE EXCEPTION 'Wave 4C immutable history trigger missing';
            END IF;
            IF EXISTS (
              SELECT 1 FROM (VALUES
                ('mira_asaas_workspace_destinations'),
                ('mira_payment_provider_profiles'),
                ('mira_student_payment_intents'),
                ('mira_student_payment_evidence')
              ) AS required(table_name)
              LEFT JOIN pg_class cls ON cls.relname=required.table_name
              LEFT JOIN pg_namespace ns ON ns.oid=cls.relnamespace AND ns.nspname='public'
              WHERE cls.oid IS NULL OR ns.oid IS NULL
                OR NOT cls.relrowsecurity OR NOT cls.relforcerowsecurity
                OR NOT EXISTS (
                  SELECT 1 FROM pg_policies p
                  WHERE p.schemaname='public' AND p.tablename=required.table_name
                    AND p.policyname=required.table_name || '_tenant_access'
                )
            ) THEN
              RAISE EXCEPTION 'Wave 4D payments tenant RLS/FORCE RLS policy missing';
            END IF;
            IF EXISTS (
              SELECT 1 FROM (VALUES
                ('mira_asaas_destination_reviews'),
                ('mira_asaas_customer_bindings'),
                ('mira_asaas_charges'),
                ('mira_asaas_webhook_events'),
                ('mira_asaas_webhook_applications')
              ) AS required(table_name)
              LEFT JOIN pg_class cls ON cls.relname=required.table_name
              LEFT JOIN pg_namespace ns ON ns.oid=cls.relnamespace AND ns.nspname='public'
              WHERE cls.oid IS NULL OR ns.oid IS NULL
                OR NOT cls.relrowsecurity OR NOT cls.relforcerowsecurity
                OR NOT EXISTS (SELECT 1 FROM pg_policies p
                  WHERE p.schemaname='public' AND p.tablename=required.table_name
                    AND p.policyname=required.table_name || '_tenant_access')
            ) THEN
              RAISE EXCEPTION 'Wave 4D-B Asaas tenant RLS/FORCE RLS is missing';
            END IF;
            IF (SELECT count(*) FROM pg_trigger WHERE tgname IN (
              'mira_asaas_webhook_events_immutable',
              'mira_asaas_webhook_applications_immutable',
              'mira_asaas_destination_reviews_immutable'
            ) AND NOT tgisinternal) <> 3 THEN
              RAISE EXCEPTION 'Wave 4D-B Asaas immutable event log trigger missing';
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_proc WHERE proname='mira_asaas_resolve_payment') THEN
              RAISE EXCEPTION 'Wave 4D-B authenticated global webhook resolver missing';
            END IF;
            IF (
              SELECT count(*) FROM pg_trigger
              WHERE tgname IN (
                'mira_student_payment_intents_immutable',
                'mira_student_payment_evidence_immutable'
              ) AND NOT tgisinternal
            ) <> 2 THEN
              RAISE EXCEPTION 'Wave 4D immutable payment ledger trigger missing';
            END IF;
            -- Wave 6 schema checks are intentionally post-migration.
            IF EXISTS (
              SELECT 1 FROM (VALUES
                ('mira_academic_policies'),
                ('mira_academic_curricula'),
                ('mira_academic_curriculum_items'),
                ('mira_academic_student_programs'),
                ('mira_academic_enrollment_requests'),
                ('mira_academic_enrollment_request_classes'),
                ('mira_academic_class_outcomes'),
                ('mira_academic_operation_events')
              ) AS required(table_name)
              LEFT JOIN pg_class cls ON cls.relname = required.table_name
              LEFT JOIN pg_namespace ns ON ns.oid = cls.relnamespace AND ns.nspname = 'public'
              WHERE cls.oid IS NULL OR ns.oid IS NULL
                OR NOT cls.relrowsecurity OR NOT cls.relforcerowsecurity
                OR NOT EXISTS (
                  SELECT 1 FROM pg_policies p
                  WHERE p.schemaname = 'public' AND p.tablename = required.table_name
                    AND p.policyname = required.table_name || '_tenant_access'
                )
            ) THEN
              RAISE EXCEPTION 'Wave 6 tenant RLS/FORCE RLS controls missing';
            END IF;
            IF (
              SELECT count(*) FROM pg_trigger
              WHERE tgname IN (
                'mira_academic_policies_guard',
                'mira_academic_curricula_guard',
                'mira_academic_class_outcomes_guard',
                'mira_academic_operation_events_guard',
                'mira_academic_curriculum_item_guard'
              ) AND NOT tgisinternal
            ) <> 5 THEN
              RAISE EXCEPTION 'Wave 6 immutable policy/curriculum/outcome/audit triggers missing';
            END IF;
            IF NOT EXISTS (
              SELECT 1 FROM pg_constraint
              WHERE conname='fk_mira_outcome_class_enrollment_tenant'
                AND contype='f'
            ) THEN
              RAISE EXCEPTION 'Wave 6 final outcome must be bound to real class enrollment';
            END IF;
          END
          $mira$;
          SQL
      - name: Wave 7 read-only schema drift and search indexes gate
        working-directory: backend
        run: python scripts/wave7_schema_preflight.py --output ../wave7-schema-preflight.json
      - name: Create separate disposable database for ORM tests
        env:
          ADMIN_DATABASE_URL: postgresql://beacon:beacon_secret@localhost:5432/postgres
        run: |
          # Keep the migrated, RLS-protected beacon_test intact. The general
          # ORM tests use a separate empty DB, as their fixtures require
          # drop_all/create_all and must not alter production-style policies.
          psql "$ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 -c             "CREATE DATABASE beacon_pytest_test OWNER mira_test_runner;"
          echo "DATABASE_URL=postgresql+asyncpg://mira_test_runner:mira_test_runner_secret@localhost:5432/beacon_pytest_test" >> "$GITHUB_ENV"
          echo "DATABASE_URL_SYNC=postgresql://mira_test_runner:mira_test_runner_secret@localhost:5432/beacon_pytest_test" >> "$GITHUB_ENV"
          echo "MIRA_TEST_PSQL_URL=postgresql://mira_test_runner:mira_test_runner_secret@localhost:5432/beacon_pytest_test" >> "$GITHUB_ENV"
          echo "MIRA_TEST_PRESERVE_MIGRATED_SCHEMA=false" >> "$GITHUB_ENV"
      - name: Lint (ruff)
        working-directory: backend
        run: ruff check app
      - name: Validate Wave 3 view sharing and RLS
        working-directory: backend
        run: PYTHONPATH=. pytest -q tests/test_object_views_wave3.py -x
      - name: Validate Wave 5 Work Inbox, concurrency and idempotency
        working-directory: backend
        run: PYTHONPATH=. pytest -q tests/test_work_inbox_wave5.py -x
      - name: Validate Wave 6 federated search RBAC and provider isolation
        working-directory: backend
        run: PYTHONPATH=. pytest -q tests/test_universal_search_wave6.py -x
      - name: Validate Wave 7 six authenticated API journeys
        working-directory: backend
        run: PYTHONPATH=. pytest -q tests/test_wave7_authenticated_journeys.py -x
      - name: Validate Wave 7 release gate
        working-directory: backend
        run: PYTHONPATH=. pytest -q tests/test_wave7_release_gate.py -x
      - name: Validate Wave 7 schema preflight policy
        working-directory: backend
        run: PYTHONPATH=. pytest -q tests/test_wave7_schema_preflight.py -x
      - name: Run tests (pytest)
        working-directory: backend
        run: PYTHONPATH=. pytest -v --maxfail=1

  frontend-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint frontend
        run: npm run lint
      - name: Test frontend helpers
        run: npm test
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Build frontend
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_API_URL: "http://127.0.0.1:8000"
        run: npm run build
