name: CI

on:
  push:
    branches: [main, feat/mira-control-center]
  pull_request:
    branches: [main, feat/retention-observability-analytics]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: beacon
          POSTGRES_PASSWORD: beacon_secret
          POSTGRES_DB: beacon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U beacon -d beacon_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://beacon:beacon_secret@localhost:5432/beacon_test
      DATABASE_URL_SYNC: postgresql://beacon:beacon_secret@localhost:5432/beacon_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Validate Alembic revision graph
        working-directory: backend
        run: |
          heads="$(PYTHONPATH=. alembic heads)"
          echo "$heads"
          test "$(printf '%s\n' "$heads" | grep -c '(head)')" -eq 1
          head_revision="$(printf '%s\n' "$heads" | awk 'NR == 1 { print $1 }')"
          test "$head_revision" = "015_student_campus_status"
          test "${#head_revision}" -le 32
      - name: Lint (ruff)
        working-directory: backend
        run: ruff check app
      - name: Run tests (pytest)
        working-directory: backend
        run: PYTHONPATH=. pytest -v

  frontend-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint frontend
        run: npm run lint
      - name: Build frontend
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_API_URL: "http://127.0.0.1:8000"
        run: npm run build
