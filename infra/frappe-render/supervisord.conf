[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/mira-frappe-supervisord.pid
user=root

[program:gunicorn]
command=/home/frappe/frappe-bench/env/bin/gunicorn --chdir=/home/frappe/frappe-bench/sites --bind=0.0.0.0:10000 --workers=2 --threads=4 --worker-class=gthread --timeout=120 --preload frappe.app:application
user=frappe
directory=/home/frappe/frappe-bench
autostart=true
autorestart=true
startsecs=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
stopasgroup=true
killasgroup=true

[program:worker-short]
command=/usr/local/bin/bench worker --queue short,default
user=frappe
directory=/home/frappe/frappe-bench
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
stopasgroup=true
killasgroup=true

[program:worker-long]
command=/usr/local/bin/bench worker --queue long,default,short
user=frappe
directory=/home/frappe/frappe-bench
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
stopasgroup=true
killasgroup=true

[program:scheduler]
command=/usr/local/bin/bench schedule
user=frappe
directory=/home/frappe/frappe-bench
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
stopasgroup=true
killasgroup=true

[program:socketio]
command=/home/frappe/.nvm/current/bin/node /home/frappe/frappe-bench/apps/frappe/socketio.js
user=frappe
directory=/home/frappe/frappe-bench
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
stopasgroup=true
killasgroup=true
